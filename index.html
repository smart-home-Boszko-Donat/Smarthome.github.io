<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Smart Home PRO</title>

<style>
*{box-sizing:border-box;}

body{
margin:0;
font-family:Segoe UI;
background:#020617;
color:white;
}

body.day{background:#c7d2fe;color:black;}

header{
text-align:center;
padding:15px;
background:#0f172a;
}

#floorplan{
width:800px;
height:500px;
margin:40px auto;
display:grid;
grid-template-columns:2fr 1fr 1fr;
grid-template-rows:1fr 1fr 1fr;
gap:10px;
background:#1e293b;
padding:10px;
border-radius:20px;
}

.room{
position:relative;
padding:15px;
border-radius:15px;
cursor:pointer;
overflow:hidden;
border:2px solid rgba(255,255,255,0.1);
}

.light-on{background:#60a5fa;}
.light-off{background:#0f172a;color:#64748b;}

.person{
position:absolute;
bottom:10px;
font-size:30px;
animation:walk 4s infinite alternate;
}

@keyframes walk{
0%{left:10%;}
100%{left:70%;transform:scaleX(-1);}
}

.panel{
position:fixed;
right:-320px;
top:0;
width:300px;
height:100%;
background:#0f172a;
padding:20px;
transition:0.4s;
}

.panel.open{right:0;}

button{
padding:10px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
background:#334155;
color:white;
}
</style>
</head>

<body>


<div id="loginScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#020617;display:flex;justify-content:center;align-items:center;z-index:999;">
<div style="background:#0f172a;padding:30px;border-radius:15px;width:300px;text-align:center;">
<h2>🔐 Logowanie</h2>
<input id="login" placeholder="Login" style="width:100%;padding:10px;margin:10px 0;">
<input id="password" type="password" placeholder="Hasło" style="width:100%;padding:10px;margin:10px 0;">
<button onclick="loginUser()">Zaloguj</button>
<p id="error" style="color:red;"></p>
</div>
</div>

<header>
<h1>🏠 SMART HOME PRO</h1>
<button onclick="toggleTheme()">🌗</button>
<button onclick="logout()">🚪</button>
</header>

<div id="floorplan">
<div class="room" id="salon" onclick="openRoom('Salon')">Salon<div id="icons-Salon"></div></div>
<div class="room" id="kuchnia" onclick="openRoom('Kuchnia')">Kuchnia<div id="icons-Kuchnia"></div></div>
<div class="room" id="sypialnia" onclick="openRoom('Sypialnia')">Sypialnia<div id="icons-Sypialnia"></div></div>
<div class="room" id="lazienka" onclick="openRoom('Lazienka')">Łazienka<div id="icons-Lazienka"></div></div>
<div class="room" id="biuro" onclick="openRoom('Biuro')">Biuro<div id="icons-Biuro"></div></div>
<div class="room" id="wejscie" onclick="openRoom('Wejscie')">Wejście<div id="icons-Wejscie"></div></div>
</div>

<div class="panel" id="panel">
<h2 id="roomTitle"></h2>
<button onclick="toggleLight()">💡</button>
<button onclick="toggleAlarm()">🔒</button>
<button onclick="toggleMotion()">👁️</button>
<button onclick="toggleFire()">🔥</button>
<button onclick="closePanel()">Zamknij</button>
<div id="status"></div>
</div>

<script>
const defaultRooms={
Salon:{light:false,alarm:true,motion:false,fire:false},
Kuchnia:{light:false,alarm:true,motion:false,fire:false},
Sypialnia:{light:false,alarm:true,motion:false,fire:false},
Lazienka:{light:false,alarm:true,motion:false,fire:false},
Biuro:{light:false,alarm:true,motion:false,fire:false},
Wejscie:{light:false,alarm:true,motion:false,fire:false}
};

let rooms={};
let currentRoom=null;


function loginUser(){
const l=document.getElementById("login").value;
const p=document.getElementById("password").value;

if(l==="admin" && p==="admin"){
localStorage.setItem("logged","true");
document.getElementById("loginScreen").style.display="none";
}else{
document.getElementById("error").innerText="Błędne dane";
}
}

function checkLogin(){
if(localStorage.getItem("logged")==="true"){
document.getElementById("loginScreen").style.display="none";
}
}

function logout(){
localStorage.removeItem("logged");
location.reload();
}


function loadState(){
const s=localStorage.getItem("smartHome");
rooms=s?JSON.parse(s):{...defaultRooms};
}

function saveState(){
localStorage.setItem("smartHome",JSON.stringify(rooms));
}


function toggleTheme(){
document.body.classList.toggle("day");
localStorage.setItem("theme",document.body.classList.contains("day"));
}

function loadTheme(){
if(localStorage.getItem("theme")==="true"){
document.body.classList.add("day");
}
}


function openRoom(r){
currentRoom=r;
document.getElementById("panel").classList.add("open");
document.getElementById("roomTitle").innerText=r;
updateRooms();
}

function closePanel(){
document.getElementById("panel").classList.remove("open");
}

function toggleLight(){rooms[currentRoom].light=!rooms[currentRoom].light;saveState();updateRooms();}
function toggleAlarm(){rooms[currentRoom].alarm=!rooms[currentRoom].alarm;saveState();updateRooms();}
function toggleMotion(){rooms[currentRoom].motion=!rooms[currentRoom].motion;saveState();updateRooms();}
function toggleFire(){rooms[currentRoom].fire=!rooms[currentRoom].fire;saveState();updateRooms();}

function updateRooms(){
for(const r in rooms){
const d=rooms[r];
const div=document.getElementById(r.toLowerCase());
div.className="room "+(d.light?"light-on":"light-off");

let p=div.querySelector(".person");
if(d.motion && d.alarm){
if(!p){
p=document.createElement("div");
p.className="person";
p.innerText="👤";
div.appendChild(p);
}
}else if(p){p.remove();}

document.getElementById("icons-"+r).innerHTML=
`${d.light?"💡":"🌑"} ${d.alarm?"🔒":"🔓"} ${d.motion?"👁️":"✅"} ${d.fire?"🔥":""}`;
}

if(currentRoom){
const s=rooms[currentRoom];
document.getElementById("status").innerHTML=
`LIGHT:${s.light}<br>ALARM:${s.alarm}<br>MOTION:${s.motion}<br>FIRE:${s.fire}`;
}
}


loadState();
loadTheme();
checkLogin();
updateRooms();
</script>

</body>
</html>
